; PlatformIO build for the Arc Guard firmware (the same sources also open in Arduino IDE:
; open firmware/ArcGuard/ArcGuard.ino).
[platformio]
src_dir = ArcGuard
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    madhephaestus/ESP32Servo@3.0.6
    bblanchon/ArduinoJson@7.2.1
    links2004/WebSockets@2.6.1

; Phase-2 hardware test sketches (firmware/tests/<name>/). Easiest: open the .ino in Arduino IDE.
; With PlatformIO (PowerShell, in the firmware folder):
;   $env:PLATFORMIO_SRC_DIR = "tests/test_sensor1"; pio run -e tests -t upload -t monitor
;   Remove-Item Env:PLATFORMIO_SRC_DIR      # before building the main firmware again
[env:tests]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = madhephaestus/ESP32Servo@3.0.6
