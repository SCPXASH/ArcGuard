<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-opacity=".35"/></filter></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="36" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle" >Sequential Measurement Schedule (one ping in flight at a time)</text><text x="135" y="124" font-size="14" font-weight="bold" fill="#263238" text-anchor="end" >Sensor 1</text><line x1="150" y1="140" x2="1162.0" y2="140" stroke="#eceff1"/><text x="135" y="184" font-size="14" font-weight="bold" fill="#263238" text-anchor="end" >Sensor 2</text><line x1="150" y1="200" x2="1162.0" y2="200" stroke="#eceff1"/><text x="135" y="244" font-size="14" font-weight="bold" fill="#263238" text-anchor="end" >Sensor 3</text><line x1="150" y1="260" x2="1162.0" y2="260" stroke="#eceff1"/><text x="135" y="304" font-size="14" font-weight="bold" fill="#263238" text-anchor="end" >Servo</text><line x1="150" y1="320" x2="1162.0" y2="320" stroke="#eceff1"/><rect x="150.0" y="110" width="110.00000000000001" height="28" rx="4" fill="#f9a825" opacity="1"/><text x="205.0" y="129" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle" >ping S1</text><rect x="312.8" y="170" width="110.00000000000001" height="28" rx="4" fill="#1e88e5" opacity="1"/><text x="367.8" y="189" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle" >ping S2</text><rect x="312.8" y="290" width="35.2" height="28" rx="4" fill="#ef6c00" opacity="1"/><rect x="348.0" y="290" width="162.8" height="28" rx="4" fill="#ef6c00" opacity=".35"/><text x="429.40000000000003" y="309" font-size="11.5" font-weight="bold" fill="#bf360c" text-anchor="middle" >settle</text><rect x="510.8" y="230" width="110.00000000000001" height="28" rx="4" fill="#2e7d32" opacity="1"/><text x="565.8" y="249" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle" >ping S3 @θ</text><text x="330.4" y="284" font-size="11" font-weight="normal" fill="#bf360c" text-anchor="middle" >step θ→θ+5°</text><rect x="656.0" y="110" width="110.00000000000001" height="28" rx="4" fill="#f9a825" opacity="1"/><text x="711.0" y="129" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle" >ping S1</text><rect x="818.8" y="170" width="110.00000000000001" height="28" rx="4" fill="#1e88e5" opacity="1"/><text x="873.8" y="189" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle" >ping S2</text><rect x="818.8" y="290" width="35.2" height="28" rx="4" fill="#ef6c00" opacity="1"/><rect x="854.0" y="290" width="162.8" height="28" rx="4" fill="#ef6c00" opacity=".35"/><text x="935.4000000000001" y="309" font-size="11.5" font-weight="bold" fill="#bf360c" text-anchor="middle" >settle</text><rect x="1016.8" y="230" width="110.00000000000001" height="28" rx="4" fill="#2e7d32" opacity="1"/><text x="1071.8" y="249" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle" >ping S3 @θ</text><text x="836.4" y="284" font-size="11" font-weight="normal" fill="#bf360c" text-anchor="middle" >step θ→θ+5°</text><line x1="150.0" y1="330" x2="150.0" y2="336" stroke="#607d8b"/><text x="150.0" y="352" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle" >0 ms</text><line x1="260.0" y1="330" x2="260.0" y2="336" stroke="#607d8b"/><text x="260.0" y="352" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle" >25 ms</text><line x1="370.0" y1="330" x2="370.0" y2="336" stroke="#607d8b"/><text x="370.0" y="352" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle" >50 ms</text><line x1="480.0" y1="330" x2="480.0" y2="336" stroke="#607d8b"/><text x="480.0" y="352" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle" >75 ms</text><line x1="590.0" y1="330" x2="590.0" y2="336" stroke="#607d8b"/><text x="590.0" y="352" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle" >100 ms</text><line x1="700.0" y1="330" x2="700.0" y2="336" stroke="#607d8b"/><text x="700.0" y="352" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle" >125 ms</text><line x1="810.0" y1="330" x2="810.0" y2="336" stroke="#607d8b"/><text x="810.0" y="352" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle" >150 ms</text><line x1="920.0000000000001" y1="330" x2="920.0000000000001" y2="336" stroke="#607d8b"/><text x="920.0000000000001" y="352" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle" >175 ms</text><line x1="1030.0" y1="330" x2="1030.0" y2="336" stroke="#607d8b"/><text x="1030.0" y="352" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle" >200 ms</text><line x1="1140.0" y1="330" x2="1140.0" y2="336" stroke="#607d8b"/><text x="1140.0" y="352" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle" >225 ms</text><line x1="150" y1="330" x2="1162.0" y2="330" stroke="#607d8b"/><text x="600.0" y="385" font-size="13" font-weight="normal" fill="#455a64" text-anchor="middle" >≈12 ms gaps between pings let echoes die out. One cycle ≈ 110 ms → fixed sensors ≈ 9 Hz each; 37 scan steps (0–180° at 5°) ≈ 4 s per sweep.</text><text x="600.0" y="405" font-size="13" font-weight="normal" fill="#455a64" text-anchor="middle" >Servo moves while S1/S2 ping, so settling costs no extra time. Sweep runs 0→180 then 180→0 (no jump-back).</text></svg>