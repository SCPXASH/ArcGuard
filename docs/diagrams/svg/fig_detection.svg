<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-opacity=".35"/></filter></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="36" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle" >Detection Logic (runs per fixed sensor and per scan angle)</text><rect x="40" y="80" width="230" height="110" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/><text x="155.0" y="102" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >New reading d</text><text x="155.0" y="122" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >valid if 2 ≤ d ≤ 400 cm</text><text x="155.0" y="139" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >and echo did not time out</text><text x="155.0" y="156" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >median of last 3 samples</text><rect x="340" y="80" width="250" height="110" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/><text x="465.0" y="102" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >Deviation</text><text x="465.0" y="122" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >Δ = d − baseline b</text><text x="465.0" y="139" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >τ = max(τ_abs , k·σ)</text><text x="465.0" y="156" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >rate r = Δd / Δt</text><path d="M270,135 L340,135" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="80" y="300" width="190" height="80" rx="40" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/><text x="175" y="335" font-size="16" font-weight="bold" fill="#311b92" text-anchor="middle" >IDLE</text><text x="175" y="356" font-size="12" font-weight="normal" fill="#4527a0" text-anchor="middle" >|Δ| ≤ τ</text><rect x="360" y="300" width="190" height="80" rx="40" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/><text x="455" y="335" font-size="16" font-weight="bold" fill="#311b92" text-anchor="middle" >CANDIDATE</text><text x="455" y="356" font-size="12" font-weight="normal" fill="#4527a0" text-anchor="middle" >|Δ| &gt; τ, count &lt; M</text><rect x="660" y="300" width="190" height="80" rx="40" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/><text x="755" y="335" font-size="16" font-weight="bold" fill="#311b92" text-anchor="middle" >CONFIRMED</text><text x="755" y="356" font-size="12" font-weight="normal" fill="#4527a0" text-anchor="middle" >count ≥ M and t ≥ T_min</text><rect x="960" y="300" width="190" height="80" rx="40" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/><text x="1055" y="335" font-size="16" font-weight="bold" fill="#311b92" text-anchor="middle" >COOLDOWN</text><text x="1055" y="356" font-size="12" font-weight="normal" fill="#4527a0" text-anchor="middle" >suppress repeats</text><path d="M465,190 L455,300" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><path d="M270,330 L360,330" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="288.46" y="310.5" width="53.080000000000005" height="17.5" rx="3" fill="#ffffff" opacity=".92"/><text x="315" y="322" font-size="11.5" font-weight="normal" fill="#455a64" text-anchor="middle" >|Δ| &gt; τ</text><path d="M360,355 L270,355" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="269.14" y="363.5" width="91.72000000000001" height="17.5" rx="3" fill="#ffffff" opacity=".92"/><text x="315" y="375" font-size="11.5" font-weight="normal" fill="#455a64" text-anchor="middle" >back within τ</text><path d="M550,340 L660,340" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="549.48" y="320.5" width="111.04" height="17.5" rx="3" fill="#ffffff" opacity=".92"/><text x="605" y="332" font-size="11.5" font-weight="normal" fill="#455a64" text-anchor="middle" >M valid in a row</text><path d="M850,340 L960,340" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><path d="M1055,380 L1055,430 L175,430 L175,380" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="511.18" y="433.5" width="207.64000000000001" height="17.5" rx="3" fill="#ffffff" opacity=".92"/><text x="615" y="445" font-size="11.5" font-weight="normal" fill="#455a64" text-anchor="middle" >after cooldown time and |Δ| ≤ τ</text><rect x="560" y="490" width="300" height="60" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/><text x="710.0" y="525.0" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >Classify confirmed change</text><path d="M755,380 L710,490" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="60" y="590" width="520" height="95" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="320.0" y="612" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >MOVEMENT event (dynamic)</text><text x="320.0" y="632" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >|rate| &gt; r_min,  or change returns to baseline,</text><text x="320.0" y="649" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >or S3 change shifts to neighbouring angles between sweeps</text><rect x="620" y="590" width="540" height="95" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.6"/><text x="890.0" y="612" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >ANOMALY event (environment state)</text><text x="890.0" y="632" font-size="11.5" font-weight="normal" fill="#37474f" text-anchor="middle" >OBJECT_APPEARED (Δ &lt; −τ, persists ≥ T_dwell) • OBJECT_DISAPPEARED (Δ &gt; +τ)</text><text x="890.0" y="649" font-size="11.5" font-weight="normal" fill="#37474f" text-anchor="middle" >SUDDEN_CHANGE (|d_t − d_t−1| &gt; J) • PATTERN (≥ K angles in one sweep)</text><text x="890.0" y="666" font-size="11.5" font-weight="normal" fill="#37474f" text-anchor="middle" >SENSOR_FAULT (≥ F invalid readings in a row)</text><path d="M620,550 L320,590" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><path d="M800,550 L890,590" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="900" y="80" width="260" height="110" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.6"/><text x="1030.0" y="102" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >Baseline (calibration)</text><text x="1030.0" y="122" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >N = 20 samples per direction</text><text x="1030.0" y="139" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >b = median, σ = 1.4826·MAD</text><text x="1030.0" y="156" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >re-run from dashboard</text><path d="M900,135 L590,135" fill="none" stroke="#37474f" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)" /></svg>