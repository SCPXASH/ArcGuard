<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="640" viewBox="0 0 1150 640" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-opacity=".35"/></filter></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="575.0" y="36" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle" >Communication Flow</text><rect x="55" y="60" width="190" height="44" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="150.0" y="87.0" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >ESP32</text><line x1="150" y1="104" x2="150" y2="620" stroke="#90a4ae" stroke-dasharray="5 5"/><rect x="345" y="60" width="190" height="44" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="440.0" y="87.0" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >FastAPI backend</text><line x1="440" y1="104" x2="440" y2="620" stroke="#90a4ae" stroke-dasharray="5 5"/><rect x="625" y="60" width="190" height="44" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="720.0" y="87.0" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >SQLite</text><line x1="720" y1="104" x2="720" y2="620" stroke="#90a4ae" stroke-dasharray="5 5"/><rect x="905" y="60" width="190" height="44" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="1000.0" y="87.0" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >Dashboard (browser)</text><line x1="1000" y1="104" x2="1000" y2="620" stroke="#90a4ae" stroke-dasharray="5 5"/><path d="M150,140 L440,140" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="133.07999999999998" y="121" width="323.84000000000003" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="295.0" y="133" font-size="12" font-weight="normal" fill="#37474f" text-anchor="middle" >1. connect /ws/device + hello {fw, mac, config}</text><path d="M440,175 L150,175" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="193.56" y="156" width="202.88000000000002" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="295.0" y="168" font-size="12" font-weight="normal" fill="#37474f" text-anchor="middle" >2. current settings (from DB)</text><path d="M150,215 L440,215" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="116.27999999999997" y="196" width="357.44000000000005" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="295.0" y="208" font-size="12" font-weight="normal" fill="#37474f" text-anchor="middle" >3. telemetry batch every 200 ms {s1,s2,s3,angle,...}</text><path d="M440,250 L720,250" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="468.48" y="231" width="223.04000000000002" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="580.0" y="243" font-size="12" font-weight="normal" fill="#37474f" text-anchor="middle" >4. insert readings / scan points</text><path d="M440,285 L1000,285" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="584.96" y="266" width="270.08000000000004" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="720.0" y="278" font-size="12" font-weight="normal" fill="#37474f" text-anchor="middle" >5. broadcast live frame (/ws/dashboard)</text><path d="M150,330 L440,330" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="133.07999999999998" y="311" width="323.84000000000003" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="295.0" y="323" font-size="12" font-weight="normal" fill="#37474f" text-anchor="middle" >6. event {MOVEMENT | ANOMALY, sensor, Δ, angle}</text><path d="M440,365 L720,365" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="525.6" y="346" width="108.80000000000001" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="580.0" y="358" font-size="12" font-weight="normal" fill="#37474f" text-anchor="middle" >7. insert event</text><path d="M440,400 L1000,400" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="581.6" y="381" width="276.8" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="720.0" y="393" font-size="12" font-weight="normal" fill="#37474f" text-anchor="middle" >8. push event → toast + log + radar mark</text><path d="M1000,450 L440,450" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="534.56" y="431" width="370.88000000000005" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="720.0" y="443" font-size="12" font-weight="normal" fill="#37474f" text-anchor="middle" >9. PUT /api/settings  or  POST /api/commands/calibrate</text><path d="M440,485 L150,485" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="223.8" y="466" width="142.4" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="295.0" y="478" font-size="12" font-weight="normal" fill="#37474f" text-anchor="middle" >10. config / command</text><path d="M150,520 L440,520" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="213.72" y="501" width="162.56" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="295.0" y="513" font-size="12" font-weight="normal" fill="#37474f" text-anchor="middle" >11. ack {applied: true}</text><path d="M440,555 L1000,555" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="625.28" y="536" width="189.44000000000003" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="720.0" y="548" font-size="12" font-weight="normal" fill="#37474f" text-anchor="middle" >12. setting state = Applied</text><path d="M150,600 L440,600" fill="none" stroke="#c62828" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" /><rect x="75.95999999999998" y="581" width="438.08000000000004" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="295.0" y="593" font-size="12" font-weight="normal" fill="#c62828" text-anchor="middle" >heartbeat every 2 s — none for 6 s → device OFFLINE on dashboard</text></svg>