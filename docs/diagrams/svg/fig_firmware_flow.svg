<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-opacity=".35"/></filter></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="500.0" y="36" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle" >Firmware Flow (setup + non-blocking loop)</text><rect x="170" y="70" width="660" height="56" rx="10" fill="#ede7f6" stroke="#546e7a" stroke-width="1.6"/><text x="500.0" y="103.0" font-size="14.5" font-weight="bold" fill="#102027" text-anchor="middle" >setup(): GPIO, buzzer OFF, servo attach, load NVS config</text><path d="M500,126 L500,148" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="170" y="148" width="660" height="56" rx="10" fill="#ede7f6" stroke="#546e7a" stroke-width="1.6"/><text x="500.0" y="181.0" font-size="14.5" font-weight="bold" fill="#102027" text-anchor="middle" >Start Wi-Fi (auto-reconnect) and WebSocket client</text><path d="M500,204 L500,226" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="170" y="226" width="660" height="56" rx="10" fill="#ede7f6" stroke="#546e7a" stroke-width="1.6"/><text x="500.0" y="259.0" font-size="14.5" font-weight="bold" fill="#102027" text-anchor="middle" >Baseline calibration: 20 samples S1, S2 and every S3 angle</text><path d="M500,282 L500,304" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="170" y="304" width="660" height="56" rx="10" fill="#fff8e1" stroke="#546e7a" stroke-width="1.6"/><text x="500.0" y="337.0" font-size="14.5" font-weight="bold" fill="#102027" text-anchor="middle" >loop(): scheduler due? → trigger next sensor (S1 → S2 → S3)</text><path d="M500,360 L500,382" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="170" y="382" width="660" height="56" rx="10" fill="#fff8e1" stroke="#546e7a" stroke-width="1.6"/><text x="500.0" y="415.0" font-size="14.5" font-weight="bold" fill="#102027" text-anchor="middle" >Echo captured / timeout → validate → median filter</text><path d="M500,438 L500,460" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="170" y="460" width="660" height="56" rx="10" fill="#fff8e1" stroke="#546e7a" stroke-width="1.6"/><text x="500.0" y="493.0" font-size="14.5" font-weight="bold" fill="#102027" text-anchor="middle" >Update detector FSM → emit MOVEMENT / ANOMALY event</text><path d="M500,516 L500,538" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="170" y="538" width="660" height="56" rx="10" fill="#fff8e1" stroke="#546e7a" stroke-width="1.6"/><text x="500.0" y="571.0" font-size="14.5" font-weight="bold" fill="#102027" text-anchor="middle" >Servo controller: step angle when S3 sample done</text><path d="M500,594 L500,616" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="170" y="616" width="660" height="56" rx="10" fill="#e8f5e9" stroke="#546e7a" stroke-width="1.6"/><text x="500.0" y="649.0" font-size="14.5" font-weight="bold" fill="#102027" text-anchor="middle" >Every 200 ms: send telemetry batch; every 2 s: heartbeat</text><path d="M500,672 L500,694" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="170" y="694" width="660" height="56" rx="10" fill="#e8f5e9" stroke="#546e7a" stroke-width="1.6"/><text x="500.0" y="727.0" font-size="14.5" font-weight="bold" fill="#102027" text-anchor="middle" >Handle incoming config/commands → apply, save NVS, ACK</text><path d="M500,750 L500,772" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="170" y="772" width="660" height="56" rx="10" fill="#efebe9" stroke="#546e7a" stroke-width="1.6"/><text x="500.0" y="805.0" font-size="14.5" font-weight="bold" fill="#102027" text-anchor="middle" >Alarm controller: buzzer pattern if confirmed event</text><path d="M830,800 L900,800 L900,332 L830,332" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="901" y="526" width="48.32000000000001" height="18" rx="3" fill="#ffffff" opacity=".92"/><text x="905" y="538" font-size="12" font-weight="normal" fill="#455a64" text-anchor="start" >repeat</text></svg>