<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-opacity=".35"/></filter></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle" >Hardware Block Diagram</text><rect x="430" y="200" width="240" height="150" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.6"/><text x="550.0" y="222" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >ESP32-WROOM-32U</text><text x="550.0" y="242" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >Dual-core 240 MHz</text><text x="550.0" y="259" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >Wi-Fi 802.11 b/g/n (2.4 GHz)</text><text x="550.0" y="276" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >on-board 3.3 V regulator</text><text x="550.0" y="293" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >LEDC PWM • GPIO • NVS</text><rect x="40" y="70" width="250" height="80" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="165.0" y="92" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >Sensor 1 (fixed)</text><text x="165.0" y="112" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >Ultrasonic, 2–400 cm</text><text x="165.0" y="129" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >TRIG 23 • ECHO 22</text><rect x="40" y="180" width="250" height="80" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="165.0" y="202" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >Sensor 2 (fixed)</text><text x="165.0" y="222" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >Ultrasonic, 2–400 cm</text><text x="165.0" y="239" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >TRIG 19 • ECHO 18</text><rect x="40" y="290" width="250" height="80" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="165.0" y="312" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >Sensor 3 (scanning)</text><text x="165.0" y="332" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >US-100 type, on servo horn</text><text x="165.0" y="349" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >Trig/Tx 17 • Echo/Rx 16</text><rect x="40" y="400" width="250" height="80" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.6"/><text x="165.0" y="422" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >MG90S Servo</text><text x="165.0" y="442" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >0–180°, 50 Hz PWM</text><text x="165.0" y="459" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >Signal GPIO21 • 5 V</text><rect x="810" y="80" width="250" height="80" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.6"/><text x="935.0" y="102" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >USB 5 V supply</text><text x="935.0" y="122" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >Laptop port or power bank</text><text x="935.0" y="139" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >→ 5V pin / regulator</text><rect x="810" y="235" width="250" height="80" rx="10" fill="#efebe9" stroke="#6d4c41" stroke-width="1.6"/><text x="935.0" y="257" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >Buzzer MH-FMD</text><text x="935.0" y="277" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >Local audible alarm</text><text x="935.0" y="294" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >I/O GPIO4 (active LOW)</text><rect x="810" y="390" width="250" height="80" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/><text x="935.0" y="412" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >Laptop / Server</text><text x="935.0" y="432" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >FastAPI + SQLite</text><text x="935.0" y="449" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >Web dashboard</text><path d="M290,110 L430,275" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" marker-start="url(#arr)"/><path d="M290,220 L430,275" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" marker-start="url(#arr)"/><path d="M290,330 L430,275" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" marker-start="url(#arr)"/><path d="M430,320 L290,440" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="294.82" y="188.5" width="130.36" height="17.5" rx="3" fill="#ffffff" opacity=".92"/><text x="360" y="200" font-size="11.5" font-weight="normal" fill="#455a64" text-anchor="middle" >TRIG / ECHO (3.3 V)</text><rect x="331.34" y="393.5" width="27.32" height="17.5" rx="3" fill="#ffffff" opacity=".92"/><text x="345" y="405" font-size="11.5" font-weight="normal" fill="#455a64" text-anchor="middle" >PWM</text><path d="M810,120 L670,220" fill="none" stroke="#c62828" stroke-width="1.8"  marker-end="url(#arr)" /><rect x="731.34" y="138.5" width="27.32" height="17.5" rx="3" fill="#ffffff" opacity=".92"/><text x="745" y="150" font-size="11.5" font-weight="normal" fill="#c62828" text-anchor="middle" >5 V</text><path d="M670,275 L810,275" fill="none" stroke="#37474f" stroke-width="1.8"  marker-end="url(#arr)" /><path d="M670,320 L810,430" fill="none" stroke="#1565c0" stroke-width="1.8"  marker-end="url(#arrB)" marker-start="url(#arrB)"/><rect x="686.26" y="383.5" width="117.48" height="17.5" rx="3" fill="#ffffff" opacity=".92"/><text x="745" y="395" font-size="11.5" font-weight="normal" fill="#1565c0" text-anchor="middle" >Wi-Fi • WebSocket</text><text x="550.0" y="530" font-size="13" font-weight="normal" fill="#455a64" text-anchor="middle" >3.3 V from the on-board regulator feeds all three sensors and the buzzer; the servo draws from the USB 5 V line. All grounds are common.</text></svg>