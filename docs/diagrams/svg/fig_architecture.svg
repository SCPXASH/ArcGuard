 font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" ></text><rect x="518" y="803" width="34" height="58" rx="6" fill="#0b1017" stroke="#1565c0" stroke-width="1.6"/><rect x="522" y="811" width="26" height="40" rx="2" fill="#3fb6ff" opacity=".85"/><circle cx="535" cy="856" r="2" fill="#90a4ae"/><text x="851" y="817" font-size="15" font-weight="bold" fill="#102027" text-anchor="middle" >Android phone — Arc Guard app (WebView)</text><text x="851" y="837" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >shows the dashboard • vibration + notification on movement / anomaly events</text><text x="851" y="855" font-size="12.5" font-weight="normal" fill="#37474f" text-anchor="middle" >USB cable (adb reverse tcp:8000) or Wi-Fi</text><path d="M262,795 L262,756" fill="none" stroke="#1565c0" stroke-width="1.8"  marker-end="url(#arrB)" /><path d="M825,795 L825,756" fill="none" stroke="#1565c0" stroke-width="1.8"  marker-end="url(#arrB)" /><rect x="268" y="769.5" width="278.48" height="17.5" rx="3" fill="#ffffff" opacity=".92"/><text x="272" y="781" font-size="11.5" font-weight="normal" fill="#1565c0" text-anchor="start" >loads the dashboard (http://&lt;laptop&gt;:8000)</text><rect x="831" y="769.5" width="278.48" height="17.5" rx="3" fill="#ffffff" opacity=".92"/><text x="835" y="781" font-size="11.5" font-weight="normal" fill="#1565c0" text-anchor="start" >loads the same dashboard + alerts the user</text><text x="600.0" y="916" font-size="13" font-weight="normal" fill="#455a64" text-anchor="middle" >Settings flow: Dashboard → REST → backend stores → pushed to ESP32 → ESP32 applies, saves to NVS, ACKs → dashboard shows “Applied”.</text></svg>